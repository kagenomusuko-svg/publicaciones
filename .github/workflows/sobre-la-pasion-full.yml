name: Sobre la pasión - libro completo

on:
  push:
    branches: [main]
    paths:
      - 'afrodita-areia/sobre-la-pasion/*.md'
      - 'afrodita-areia/sobre-la-pasion/Portada Vol I red.png'
      - 'afrodita-areia/sobre-la-pasion/Contra portada Vol I.png'
      - 'afrodita-areia/sobre-la-pasion/maquetacion/build_full.py'
      - '.github/workflows/sobre-la-pasion-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Obtener sello institucional
        run: |
          mkdir -p afrodita-areia/sobre-la-pasion/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output afrodita-areia/sobre-la-pasion/assets/logo.svg

      - name: Generar libro completo
        run: |
          python afrodita-areia/sobre-la-pasion/maquetacion/build_full.py \
            --root sobre-la-pasion \
            --output afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.pdf

      - name: Preflight textual y estructural
        run: |
          pdfinfo afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.pdf
          pdftotext afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.pdf afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.txt
          grep -q "AFRODITA AREIA" afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.txt
          grep -q "Capítulo 15" afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.txt
          grep -q "Apéndice C" afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.txt
          grep -q "Glosario de términos" afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.txt

      - name: Seleccionar y renderizar páginas de control
        run: |
          rm -rf afrodita-areia/sobre-la-pasion/build/review-full
          mkdir -p afrodita-areia/sobre-la-pasion/build/review-full
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from pypdf import PdfReader

          pdf = Path('afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.pdf')
          reader = PdfReader(str(pdf))
          targets = [
              ('portada', 1),
              ('portadilla', 2),
          ]
          needles = [
              ('parte-i', 'Parte I'),
              ('capitulo-1', 'Capítulo 1'),
              ('parte-ii', 'Parte II'),
              ('parte-iii', 'Parte III'),
              ('parte-iv', 'Parte IV'),
              ('parte-v', 'Parte V'),
              ('apendice-a', 'Apéndice A'),
              ('apendice-b', 'Apéndice B'),
              ('apendice-c', 'Apéndice C'),
              ('glosario', 'Glosario de términos'),
          ]
          seen = set()
          for label, needle in needles:
              for i, page in enumerate(reader.pages, 1):
                  text = page.extract_text() or ''
                  if needle in text:
                      targets.append((label, i))
                      seen.add(label)
                      break
          targets.append(('contraportada', len(reader.pages)))

          for label, page_no in targets:
              out = Path('afrodita-areia/sobre-la-pasion/build/review-full') / label
              subprocess.run([
                  'pdftoppm','-jpeg','-r','105','-f',str(page_no),'-l',str(page_no),
                  str(pdf), str(out)
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          manifest = Path('afrodita-areia/sobre-la-pasion/build/review-full/manifest.txt')
          manifest.write_text('\n'.join(f'{label}: {page}' for label, page in targets), encoding='utf-8')
          PY

      - name: Hoja de contacto
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('afrodita-areia/sobre-la-pasion/build/review-full')
          files = sorted(root.glob('*.jpg'))
          cards = []
          for p in files:
              im = Image.open(p).convert('RGB')
              im.thumbnail((240, 340))
              card = Image.new('RGB', (260, 375), 'white')
              card.paste(im, ((260-im.width)//2, 8))
              d = ImageDraw.Draw(card)
              d.text((8, 352), p.stem.rsplit('-', 1)[0], fill='black')
              cards.append(card)
          cols = 4
          rows = (len(cards)+cols-1)//cols
          sheet = Image.new('RGB', (cols*260, rows*375), '#eeeeee')
          for i, card in enumerate(cards):
              sheet.paste(card, ((i%cols)*260, (i//cols)*375))
          sheet.save('afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-contacto.jpg', quality=86, optimize=True)
          PY

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: afrodita-areia-vol-i-sobre-la-pasion
          path: |
            afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.pdf
            afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-contacto.jpg
            afrodita-areia/sobre-la-pasion/build/review-full/manifest.txt
            afrodita-areia/sobre-la-pasion/build/review-full/*.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Guardar PDF y hoja de contacto en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-sobre-la-pasion.pdf
          git add afrodita-areia/sobre-la-pasion/build/afrodita-areia-vol-i-contacto.jpg
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Genera Afrodita Areia Vol. I completo"
            git pull --rebase origin main
            git push
          fi
