name: Damasén - libro completo

on:
  push:
    branches: [main]
    paths:
      - 'reivindicacion-ontologica-del-ego/afrodita-areia/damasen/*.md'
      - 'reivindicacion-ontologica-del-ego/afrodita-areia/damasen/*.png'
      - 'reivindicacion-ontologica-del-ego/afrodita-areia/damasen/maquetacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/damasen-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Obtener sello institucional
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/afrodita-areia/damasen/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output reivindicacion-ontologica-del-ego/afrodita-areia/damasen/assets/logo.svg

      - name: Generar libro completo
        run: |
          python maquetacion/build_book.py \
            --root afrodita-areia/damasen \
            --output reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.pdf

      - name: Preflight textual y estructural
        run: |
          pdfinfo reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.pdf
          pdftotext reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.pdf reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.txt
          grep -q "AFRODITA AREIA" reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.txt
          grep -q "DAMASÉN" reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.txt
          grep -q "Capítulo 20" reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.txt
          grep -q "Peribea" reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.txt
          grep -q "Glosario" reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.txt

      - name: Render de páginas de control
        run: |
          rm -rf reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/review-full
          mkdir -p reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/review-full
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          pdf = Path('reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.pdf')
          audit = json.loads(pdf.with_suffix('.pages.json').read_text(encoding='utf-8'))
          contents = audit['contents']

          def page_for(heading, kind):
              for item in contents:
                  base = item['label'].split('·', 1)[0].strip()
                  if item['kind'] == kind and base.casefold() == heading.casefold():
                      return item['physical_page']
              raise RuntimeError(f'No se encontró {kind}: {heading}')

          targets = [
              ('portada', 1),
              ('portadilla', 2),
              ('indice', 5),
              ('parte-i', page_for('Parte I', 'part')),
              ('capitulo-1', page_for('Capítulo 1', 'chapter')),
              ('parte-v', page_for('Parte V', 'part')),
              ('capitulo-20', page_for('Capítulo 20', 'chapter')),
              ('apendice', page_for('Apéndice', 'appendix')),
              ('glosario', page_for('Glosario', 'appendix')),
              ('contraportada', audit['total_pages']),
          ]
          for label, page_no in targets:
              out = Path('reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/review-full') / label
              subprocess.run([
                  'pdftoppm', '-jpeg', '-r', '110', '-f', str(page_no), '-l', str(page_no),
                  str(pdf), str(out)
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          Path('reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/review-full/manifest.txt').write_text(
              '\n'.join(f'{label}: {page}' for label, page in targets),
              encoding='utf-8',
          )
          PY

      - name: Hoja de contacto
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/review-full')
          cards = []
          for path in sorted(root.glob('*.jpg')):
              image = Image.open(path).convert('RGB')
              image.thumbnail((240, 360))
              card = Image.new('RGB', (260, 395), 'white')
              card.paste(image, ((260 - image.width) // 2, 8))
              ImageDraw.Draw(card).text((8, 372), path.stem.rsplit('-', 1)[0], fill='black')
              cards.append(card)
          cols = 4
          rows = (len(cards) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * 260, rows * 395), '#eeeeee')
          for index, card in enumerate(cards):
              sheet.paste(card, ((index % cols) * 260, (index // cols) * 395))
          sheet.save('reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-contacto.jpg', quality=88, optimize=True)
          PY

      - name: Publicar artefacto
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: afrodita-areia-vol-iii-damasen
          path: |
            reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.pdf
            reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.pages.json
            reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-contacto.jpg
            reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/review-full/manifest.txt
            reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/review-full/*.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Guardar PDF y hoja de contacto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/libros/afrodita-areia
          cp reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.pdf public/libros/afrodita-areia/volumen-III.pdf
          git add reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-damasen.pdf
          git add public/libros/afrodita-areia/volumen-III.pdf
          git add reivindicacion-ontologica-del-ego/afrodita-areia/damasen/build/afrodita-areia-vol-iii-contacto.jpg
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Genera Afrodita Areia Vol. III completo"
            git pull --rebase origin main
            git push
          fi
