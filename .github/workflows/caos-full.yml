name: Caos - libro completo

on:
  push:
    branches: [main]
    paths:
      - 'reivindicacion-ontologica-del-ego/caos/*.md'
      - 'reivindicacion-ontologica-del-ego/caos/*.png'
      - 'reivindicacion-ontologica-del-ego/caos/maquetacion.json'
      - 'reivindicacion-ontologica-del-ego/caos/publicacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/caos-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Obtener sello institucional
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/caos/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output reivindicacion-ontologica-del-ego/caos/assets/logo.svg

      - name: Generar libro completo
        run: |
          python maquetacion/build_book.py             --root reivindicacion-ontologica-del-ego/caos             --output reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf

      - name: Preflight textual
        run: |
          test -s reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf
          pdftotext reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf reivindicacion-ontologica-del-ego/caos/build/caos.txt
          grep -qi "CAOS" reivindicacion-ontologica-del-ego/caos/build/caos.txt
          grep -qi "Glosario" reivindicacion-ontologica-del-ego/caos/build/caos.txt

      - name: Render de control
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/caos/build/review
          pdfinfo reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf
          pdftoppm -jpeg -r 100 -f 1 -l 1 reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf reivindicacion-ontologica-del-ego/caos/build/review/portada
          pages=$(pdfinfo reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf | awk '/^Pages:/ {print $2}')
          pdftoppm -jpeg -r 100 -f "$pages" -l "$pages" reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf reivindicacion-ontologica-del-ego/caos/build/review/contraportada

      - name: Publicar artefacto
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: caos-el-abismo-del-ego
          path: |
            reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf
            reivindicacion-ontologica-del-ego/caos/build/caos.pages.json
            reivindicacion-ontologica-del-ego/caos/build/review/*.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Publicar PDF y portada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/libros/caos
          cp reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf public/libros/caos/caos.pdf
          cp reivindicacion-ontologica-del-ego/caos/Portada.png public/libros/caos/portada.png
          git add reivindicacion-ontologica-del-ego/caos/build
          git add public/libros/caos/caos.pdf public/libros/caos/portada.png
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Genera Caos completo"
            git fetch origin main
            git reset --soft origin/main
            git commit -m "[skip ci] Genera Caos completo" --allow-empty
            git push origin HEAD:main
          fi
