name: Caos — maquetación y publicación

on:
  push:
    branches: [main]
    paths:
      - 'reivindicacion-ontologica-del-ego/caos/*.md'
      - 'reivindicacion-ontologica-del-ego/caos/*.png'
      - 'reivindicacion-ontologica-del-ego/caos/maquetacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/caos-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar tipografía y herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Preparar sello institucional
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/caos/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output reivindicacion-ontologica-del-ego/caos/assets/logo.svg

      - name: Maquetar el libro
        run: |
          python maquetacion/build_book.py \
            --root reivindicacion-ontologica-del-ego/caos \
            --output reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf

      - name: Extraer y validar texto, notas y símbolos
        run: |
          PDF=reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf
          TXT=reivindicacion-ontologica-del-ego/caos/build/caos.txt
          pdfinfo "$PDF"
          pdftotext -layout "$PDF" "$TXT"
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          root = Path("reivindicacion-ontologica-del-ego/caos")
          source = "\n".join((root / f"{n:02}.md").read_text(encoding="utf-8") for n in range(1, 16))
          rendered = (root / "build/caos.txt").read_text(encoding="utf-8")
          expected = Counter(re.findall(r"\[(\d+)\]", source))
          actual = Counter(re.findall(r"\[\s*(\d+)\s*\]", rendered))
          if expected != actual:
              raise SystemExit(f"Llamadas/definiciones de notas distintas entre fuente y PDF. Fuente: {expected - actual}; PDF extra: {actual - expected}")
          symbols = ["∫", "ℝ", "ℕ", "ℵ₀", "φ", "Δ", "ℏ", "ε", "δ", "α", "β", "→", "≠", "∞"]
          missing = [symbol for symbol in symbols if symbol in source and symbol not in rendered]
          if missing:
              raise SystemExit(f"Símbolos presentes en el original y ausentes en el PDF extraído: {missing}")
          for passage in ("La trampa del origen", "El colapso", "Caos", "El ego como condición mínima causal", "Häufungspunkt", "Heisenberg"):
              if passage not in rendered:
                  raise SystemExit(f"Falta en el PDF el pasaje de control: {passage}")
          print("Validación correcta: llamadas y notas conservadas; símbolos y pasajes de control presentes.")
          PY

      - name: Generar vistas de revisión
        run: |
          ROOT=reivindicacion-ontologica-del-ego/caos
          PDF="$ROOT/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf"
          REVIEW="$ROOT/build/review"
          rm -rf "$REVIEW"
          mkdir -p "$REVIEW"
          TOTAL=$(python -c "import json; print(json.load(open('$ROOT/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pages.json', encoding='utf-8'))['total_pages'])")
          pdftoppm -f 1 -l 1 -singlefile -jpeg -r 100 "$PDF" "$REVIEW/portada"
          pdftoppm -f 2 -l 2 -singlefile -jpeg -r 100 "$PDF" "$REVIEW/portadilla"
          pdftoppm -f "$TOTAL" -l "$TOTAL" -singlefile -jpeg -r 100 "$PDF" "$REVIEW/contraportada"
          # Páginas físicas 241–242 corresponden a las páginas impresas 234–235.
          pdftoppm -f 241 -l 242 -jpeg -r 150 "$PDF" "$REVIEW/isomorfismo"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          review = Path("reivindicacion-ontologica-del-ego/caos/build/review")
          labels = [("portada.jpg", "Portada"), ("portadilla.jpg", "Portadilla"), ("contraportada.jpg", "Contraportada")]
          cards = []
          for filename, label in labels:
              source = Image.open(review / filename).convert("RGB")
              source.thumbnail((280, 390))
              card = Image.new("RGB", (310, 435), "white")
              card.paste(source, ((310-source.width)//2, 8))
              ImageDraw.Draw(card).text((12, 410), label, fill="#333333")
              cards.append(card)
          sheet = Image.new("RGB", (930, 435), "#eeeeee")
          for index, card in enumerate(cards):
              sheet.paste(card, (index*310, 0))
          sheet.save("reivindicacion-ontologica-del-ego/caos/build/caos-contacto.jpg", quality=90, optimize=True)
          PY

      - name: Actualizar archivo servido por el lector del sitio
        run: |
          mkdir -p public/libros/caos
          cp reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf public/libros/caos/caos.pdf
          cp reivindicacion-ontologica-del-ego/caos/Portada.png public/libros/caos/portada.png

      - name: Guardar PDF y revisiones en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pdf
          git add reivindicacion-ontologica-del-ego/caos/build/caos-el-abismo-del-ego-y-la-doble-mediacion.pages.json
          git add reivindicacion-ontologica-del-ego/caos/build/caos.txt
          git add reivindicacion-ontologica-del-ego/caos/build/caos-contacto.jpg
          git add reivindicacion-ontologica-del-ego/caos/build/review
          git add public/libros/caos/caos.pdf public/libros/caos/portada.png
          if git diff --cached --quiet; then
            echo "Los archivos maquetados ya están actualizados."
            exit 0
          fi
          git commit -m "Re-maqueta Caos con el texto validado"
          git push origin main
