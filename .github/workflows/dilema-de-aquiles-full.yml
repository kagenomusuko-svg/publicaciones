name: El dilema de Aquiles - libro completo

on:
  push:
    branches: [main]
    paths:
      - 'reivindicacion-ontologica-del-ego/dilema-de-aquiles/*.md'
      - 'reivindicacion-ontologica-del-ego/dilema-de-aquiles/*.png'
      - 'reivindicacion-ontologica-del-ego/dilema-de-aquiles/maquetacion.json'
      - 'reivindicacion-ontologica-del-ego/dilema-de-aquiles/publicacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/dilema-de-aquiles-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Obtener sello institucional
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/dilema-de-aquiles/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output reivindicacion-ontologica-del-ego/dilema-de-aquiles/assets/logo.svg

      - name: Generar libro completo
        run: |
          python maquetacion/build_book.py \
            --root reivindicacion-ontologica-del-ego/dilema-de-aquiles \
            --output reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pdf

      - name: Preflight textual
        run: |
          test -s reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pdf
          pdftotext reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pdf reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.txt
          grep -qi "DILEMA DE AQUILES" reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.txt
          grep -qi "disociación del ego" reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.txt

      - name: Render de control
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/review
          pdfinfo reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pdf
          pdftoppm -jpeg -r 100 -f 1 -l 1 reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pdf reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/review/portada
          pages=$(pdfinfo reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pdf | awk '/^Pages:/ {print $2}')
          pdftoppm -jpeg -r 100 -f "$pages" -l "$pages" reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pdf reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/review/contraportada

      - name: Publicar artefacto
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dilema-de-aquiles
          path: |
            reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pdf
            reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pages.json
            reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/review/*.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Publicar PDF y portada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/libros/dilema-de-aquiles
          cp reivindicacion-ontologica-del-ego/dilema-de-aquiles/build/dilema-de-aquiles.pdf "public/libros/dilema-de-aquiles/El dilema de Aquiles - O la disociación del ego.pdf"
          cp reivindicacion-ontologica-del-ego/dilema-de-aquiles/Portada.png public/libros/dilema-de-aquiles/portada.png
          git add reivindicacion-ontologica-del-ego/dilema-de-aquiles/build
          git add public/libros/dilema-de-aquiles
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Genera El dilema de Aquiles completo"
            git pull --rebase origin main
            git push
          fi
