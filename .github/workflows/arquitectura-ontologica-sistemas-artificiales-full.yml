name: Arquitectura ontológica de sistemas artificiales - libro completo

on:
  push:
    branches: [main]
    paths:
      - 'reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/*.md'
      - 'reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/*.png'
      - 'reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/maquetacion.json'
      - 'reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/publicacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/arquitectura-ontologica-sistemas-artificiales-full.yml'
  pull_request:
    paths:
      - 'reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/*.md'
      - 'reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/*.png'
      - 'reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/maquetacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/arquitectura-ontologica-sistemas-artificiales-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Obtener sello institucional
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/assets/logo.svg

      - name: Preflight de estructura y Markdown
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          root = Path('reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales')
          missing = [f'{n:02}.md' for n in range(1, 30) if not (root / f'{n:02}.md').is_file()]
          if missing:
              raise SystemExit(f'Faltan archivos del libro: {missing}')
          roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX', 'XXI', 'XXII', 'XXIII', 'XXIV']
          expected = [f'# Capítulo {r}' for r in roman]
          headings = [(root / f'{n:02}.md').read_text(encoding='utf-8').splitlines()[0] for n in range(4, 28)]
          if headings != expected:
              raise SystemExit('Los encabezados de capítulo no son los 24 romanos consecutivos esperados.')
          config = json.loads((root / 'maquetacion.json').read_text(encoding='utf-8'))
          if len(config.get('parts_before', {})) != 8:
              raise SystemExit('maquetacion.json debe declarar ocho aperturas en parts_before.')
          if any(re.search(r'^# Parte\s+', (root / f'{n:02}.md').read_text(encoding='utf-8'), re.M) for n in range(4, 28)):
              raise SystemExit('Quedó un encabezado de parte duplicado dentro de un capítulo.')
          if any(line.startswith('#') and 'n · (ΔI · Δh) ≥ 4τ²' in line for line in (root / '25.md').read_text(encoding='utf-8').splitlines()):
              raise SystemExit('La fórmula de 25.md no debe ser un encabezado.')
          seven = (root / '07.md').read_text(encoding='utf-8')
          for child in ['Eros', 'Deimos', 'Anteros', 'Fobos', 'Potós', 'Harmonía']:
              if f'### {child}' not in seven:
                  raise SystemExit(f'La entrada subordinada {child} no conserva su nivel.')
          glossary = (root / '29.md').read_text(encoding='utf-8')
          for term in ['φ₁ (phi uno)', 'φ₂ (phi dos)', 'v_t']:
              if f'## {term}' not in glossary:
                  raise SystemExit(f'Falta la entrada separada {term} en el glosario.')
          print('Preflight Markdown: 29 archivos, 24 capítulos, ocho partes, fórmula y entradas del glosario verificadas.')
          PY

      - name: Generar libro completo
        run: |
          python maquetacion/build_book.py \
            --root reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales \
            --output reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.pdf

      - name: Validar índice, capítulos, partes y secciones editoriales
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path(
              'reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.pages.json'
          ).read_text(encoding='utf-8'))
          chapters = [item for item in audit['contents'] if item['kind'] == 'chapter']
          roman = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX', 'XXI', 'XXII', 'XXIII', 'XXIV']
          expected = [f'Capítulo {number}' for number in roman]
          labels = [item['label'].split(' · ', 1)[0] for item in chapters]
          missing = [label for label in expected if label not in labels]
          keys = [item['key'] for item in audit['contents']]
          labels_all = [item['label'] for item in audit['contents']]
          if missing:
              raise SystemExit(f'Faltan capítulos en el índice: {missing}')
          if len(keys) != len(set(keys)) or len(labels_all) != len(set(labels_all)):
              raise SystemExit('Hay claves o títulos duplicados en el índice.')
          if len(chapters) != len(expected):
              raise SystemExit(f'Se esperaban {len(expected)} capítulos; se generaron {len(chapters)}.')
          parts = [item for item in audit['contents'] if item['kind'] == 'part']
          if len(parts) != 8 or [item['label'].split(' · ', 1)[0] for item in parts] != [f'Parte {r}' for r in ['I','II','III','IV','V','VI','VII','VIII']]:
              raise SystemExit(f'Se esperaban ocho partes I–VIII; se encontraron {len(parts)}.')
          if not any(item['kind'] == 'epilogue' and item['label'].startswith('Epílogo ·') for item in audit['contents']):
              raise SystemExit('El epílogo no aparece en el índice.')
          if not any(item['kind'] == 'glossary' and item['label'] == 'Glosario de términos' for item in audit['contents']):
              raise SystemExit('El glosario no aparece en el índice.')
          if any(item['physical_page'] < 1 or not item['printed_page'] for item in audit['contents']):
              raise SystemExit('El índice contiene una página inválida.')
          print(f"Índice validado: {len(chapters)} capítulos, {len(parts)} partes, epílogo y glosario; claves y títulos únicos.")
          PY

      - name: Preflight textual
        run: |
          test -s reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.pdf
          pdftotext reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.pdf reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.txt
          grep -qi "ARQUITECTURA ONTOLÓGICA" reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.txt
          grep -qi "sistemas artificiales" reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.txt

      - name: Render de control de aperturas y páginas críticas
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/review
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from pypdf import PdfReader
          root = Path('reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build')
          pdf = root / 'arquitectura-ontologica-sistemas-artificiales.pdf'
          audit = json.loads((root / 'arquitectura-ontologica-sistemas-artificiales.pages.json').read_text(encoding='utf-8'))
          total = len(PdfReader(str(pdf)).pages)
          entries = audit['contents']
          pages = {item['key']: item['physical_page'] for item in entries}
          selected = {1, total}
          selected.update(item['physical_page'] for item in entries if item['kind'] in {'part', 'chapter', 'epilogue', 'glossary'})
          selected.update(pages[key] for key in ('cap-iv', 'cap-xxii') if key in pages)
          for key, end_key in (('cap-iv', 'cap-v'), ('cap-xxii', 'cap-xxiii')):
              if key in pages and end_key in pages:
                  selected.update(range(pages[key], pages[end_key]))
          text = subprocess.run(['pdftotext', '-layout', str(pdf), '-'], check=True, capture_output=True, text=True).stdout
          toc_page = next((i for i, page in enumerate(text.split('\f'), 1) if 'ÍNDICE' in page), None)
          if toc_page:
              selected.add(toc_page)
          for page in sorted(selected):
              subprocess.run(['pdftoppm', '-jpeg', '-r', '100', '-f', str(page), '-l', str(page), str(pdf), str(root / 'review' / f'pagina-{page:03}')], check=True)
          print(f'Renderizados {len(selected)} páginas de control de {total}; incluyen portada, índice, aperturas, capítulos IV/XXII, epílogo, glosario y contraportada.')
          PY
          pdfinfo reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.pdf

      - name: Publicar artefacto
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: arquitectura-ontologica-sistemas-artificiales
          path: |
            reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.pdf
            reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.pages.json
            reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/review/*.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Publicar PDF y portada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/libros/arquitectura-ontologica-sistemas-artificiales
          cp reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build/arquitectura-ontologica-sistemas-artificiales.pdf public/libros/arquitectura-ontologica-sistemas-artificiales/arquitectura-ontologica-sistemas-artificiales.pdf
          cp reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/Portada.png public/libros/arquitectura-ontologica-sistemas-artificiales/portada.png
          git add reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build
          git add public/libros/arquitectura-ontologica-sistemas-artificiales
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Genera Arquitectura ontológica de sistemas artificiales completo"
            if ! git pull --rebase origin main; then
              git checkout --theirs \
                reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build \
                public/libros/arquitectura-ontologica-sistemas-artificiales
              git add reivindicacion-ontologica-del-ego/arquitectura-ontologica-sistemas-artificiales/build
              git add public/libros/arquitectura-ontologica-sistemas-artificiales
              GIT_EDITOR=true git rebase --continue
            fi
            git push
          fi

