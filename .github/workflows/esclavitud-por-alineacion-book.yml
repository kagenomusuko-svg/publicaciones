name: La esclavitud por alineación — maquetación

on:
  push:
    branches: [main]
    paths:
      - 'reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/*.md'
      - 'reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/*.png'
      - 'reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/maquetacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/esclavitud-por-alineacion-book.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Obtener sello institucional
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/assets/logo.svg

      - name: Generar PDF
        run: |
          python maquetacion/build_book.py \
            --root reivindicacion-ontologica-del-ego/esclavitud-por-alineacion \
            --output reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/build/esclavitud-por-alineacion.pdf

      - name: Auditoría textual y formato
        run: |
          root="reivindicacion-ontologica-del-ego/esclavitud-por-alineacion"
          pdf="$root/build/esclavitud-por-alineacion.pdf"
          test -s "$pdf"
          pdftotext "$pdf" "$root/build/esclavitud-por-alineacion.txt"
          python - <<'PY'
          from pathlib import Path
          text = " ".join(Path("reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/build/esclavitud-por-alineacion.txt").read_text(encoding="utf-8").split()).casefold()
          required = [
              "la esclavitud por alineación",
              "aviso legal",
              "introducción",
              "parte i",
              "parte ii",
              "parte iii",
              "parte iv",
              "capítulo 9",
              "epílogo",
          ]
          missing = [term for term in required if term.casefold() not in text]
          print("Auditoría textual:", {term: term.casefold() in text for term in required})
          if missing:
              raise SystemExit(f"Faltan en el PDF: {missing}")
          PY
          pdfinfo "$pdf"
          pdftoppm -jpeg -r 100 -f 1 -l 1 "$pdf" "$root/build/portada"

      - name: Guardar artefacto de revisión
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: esclavitud-por-alineacion-maquetacion
          path: |
            reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/build/esclavitud-por-alineacion.pdf
            reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/build/esclavitud-por-alineacion.pages.json
            reivindicacion-ontologica-del-ego/esclavitud-por-alineacion/build/portada-1.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Guardar PDF para distribución
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          root="reivindicacion-ontologica-del-ego/esclavitud-por-alineacion"
          output="public/libros/esclavitud-por-alineacion"
          mkdir -p "$output"
          cp "$root/build/esclavitud-por-alineacion.pdf" "$output/esclavitud-por-alineacion.pdf"
          cp "$root/Portada.png" "$output/portada.png"
          git add "$root/build" "$output"
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Genera maquetación de La esclavitud por alineación"
            git pull --rebase origin main
            git push
          fi
