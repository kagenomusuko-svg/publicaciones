name: Sobre la pasión - muestra 01-09

on:
  push:
    branches: [main]
    paths:
      - 'sobre-la-pasion/*.md'
      - 'sobre-la-pasion/Portada Vol I.png'
      - 'sobre-la-pasion/Contraportada Vol I.png'
      - 'sobre-la-pasion/maquetacion/**'
      - '.github/workflows/sobre-la-pasion-sample.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow

      - name: Obtener sello institucional usado por Diálogos Eleatas
        run: |
          mkdir -p sobre-la-pasion/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output sobre-la-pasion/assets/logo.svg

      - name: Generar muestra PDF
        run: |
          python sobre-la-pasion/maquetacion/build_sample.py --root sobre-la-pasion --output sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf

      - name: Preflight básico
        run: |
          pdfinfo sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf
          pdftotext sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf - | head -120

      - name: Render de control
        run: |
          rm -rf sobre-la-pasion/build/preview
          mkdir -p sobre-la-pasion/build/preview
          pdftoppm -png -r 100 -f 1 -l 14 sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf sobre-la-pasion/build/preview/page >/dev/null 2>&1

      - name: Hoja de contacto
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          files = sorted(Path('sobre-la-pasion/build/preview').glob('page-*.png'))
          thumbs = []
          for i, p in enumerate(files, 1):
              im = Image.open(p).convert('RGB')
              im.thumbnail((260, 368))
              card = Image.new('RGB', (280, 405), 'white')
              card.paste(im, ((280-im.width)//2, 10))
              d = ImageDraw.Draw(card)
              d.text((10, 382), f'Página {i}', fill='black')
              thumbs.append(card)
          cols = 4
          rows = (len(thumbs)+cols-1)//cols
          sheet = Image.new('RGB', (cols*280, rows*405), '#eeeeee')
          for i, im in enumerate(thumbs):
              sheet.paste(im, ((i%cols)*280, (i//cols)*405))
          sheet.save('sobre-la-pasion/build/sobre-la-pasion-muestra-01-09-contacto.jpg', quality=86, optimize=True)
          PY

      - name: Guardar muestra en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf
          git add sobre-la-pasion/build/sobre-la-pasion-muestra-01-09-contacto.jpg
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Actualiza muestra maquetada 01-09"
            git push
          fi
