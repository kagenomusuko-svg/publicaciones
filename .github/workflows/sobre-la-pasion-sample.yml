name: Sobre la pasión - muestra 01-09

on:
  push:
    branches: [main]
    paths:
      - 'afrodita-areia/sobre-la-pasion/*.md'
      - 'afrodita-areia/sobre-la-pasion/Portada Vol I.png'
      - 'afrodita-areia/sobre-la-pasion/Contraportada Vol I.png'
      - 'afrodita-areia/sobre-la-pasion/maquetacion/**'
      - '.github/workflows/afrodita-areia/sobre-la-pasion-sample.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow

      - name: Obtener sello institucional usado por Diálogos Eleatas
        run: |
          mkdir -p afrodita-areia/sobre-la-pasion/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output afrodita-areia/sobre-la-pasion/assets/logo.svg

      - name: Generar muestra PDF
        run: |
          python afrodita-areia/sobre-la-pasion/maquetacion/build_sample.py --root afrodita-areia/sobre-la-pasion --output afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09.pdf

      - name: Preflight básico
        run: |
          pdfinfo afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09.pdf
          pdftotext afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09.pdf - | head -120

      - name: Render de control
        run: |
          rm -rf afrodita-areia/sobre-la-pasion/build/preview
          mkdir -p afrodita-areia/sobre-la-pasion/build/preview
          pdftoppm -png -r 100 -f 1 -l 14 afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09.pdf afrodita-areia/sobre-la-pasion/build/preview/page >/dev/null 2>&1

      - name: Hoja de contacto
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          files = sorted(Path('afrodita-areia/sobre-la-pasion/build/preview').glob('page-*.png'))
          thumbs = []
          for i, p in enumerate(files, 1):
              im = Image.open(p).convert('RGB')
              im.thumbnail((260, 368))
              card = Image.new('RGB', (280, 405), 'white')
              card.paste(im, ((280-im.width)//2, 10))
              d = ImageDraw.Draw(card)
              d.text((10, 382), f'Página {i}', fill='black')
              thumbs.append(card)
          cols = 4
          rows = (len(thumbs)+cols-1)//cols
          sheet = Image.new('RGB', (cols*280, rows*405), '#eeeeee')
          for i, im in enumerate(thumbs):
              sheet.paste(im, ((i%cols)*280, (i//cols)*405))
          sheet.save('afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09-contacto.jpg', quality=86, optimize=True)

          # Hoja mini para inspección rápida fuera de Actions.
          mini_cards = []
          for i, p in enumerate(files, 1):
              im = Image.open(p).convert('RGB')
              im.thumbnail((105, 149))
              card = Image.new('RGB', (120, 172), 'white')
              card.paste(im, ((120-im.width)//2, 4))
              d = ImageDraw.Draw(card)
              d.text((5, 155), str(i), fill='black')
              mini_cards.append(card)
          mini_cols = 4
          mini_rows = (len(mini_cards)+mini_cols-1)//mini_cols
          mini = Image.new('RGB', (mini_cols*120, mini_rows*172), '#eeeeee')
          for i, im in enumerate(mini_cards):
              mini.paste(im, ((i%mini_cols)*120, (i//mini_cols)*172))
          mini.save('afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09-contacto-mini.jpg', quality=42, optimize=True)

          # Páginas clave en tamaño de revisión: portadilla, apertura de parte y capítulo.
          review = Path('afrodita-areia/sobre-la-pasion/build/review')
          review.mkdir(parents=True, exist_ok=True)
          for page_no in (2, 12, 13):
              p = Path('afrodita-areia/sobre-la-pasion/build/preview') / f'page-{page_no:02d}.png'
              if not p.exists():
                  p = Path('afrodita-areia/sobre-la-pasion/build/preview') / f'page-{page_no}.png'
              im = Image.open(p).convert('RGB')
              im.thumbnail((420, 594))
              im.save(review / f'page-{page_no:02d}.jpg', quality=58, optimize=True)
          PY


      - name: Publicar artefacto de revisión
        uses: actions/upload-artifact@v4
        with:
          name: afrodita-areia/sobre-la-pasion-muestra-01-09
          path: |
            afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09.pdf
            afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09-contacto.jpg
            afrodita-areia/sobre-la-pasion/build/review/page-02.jpg
            afrodita-areia/sobre-la-pasion/build/review/page-12.jpg
            afrodita-areia/sobre-la-pasion/build/review/page-13.jpg
          if-no-files-found: error
          retention-days: 7

      - name: Guardar muestra en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09.pdf
          git add afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09-contacto.jpg
          git add afrodita-areia/sobre-la-pasion/build/afrodita-areia/sobre-la-pasion-muestra-01-09-contacto-mini.jpg
          git add afrodita-areia/sobre-la-pasion/build/review/page-02.jpg
          git add afrodita-areia/sobre-la-pasion/build/review/page-12.jpg
          git add afrodita-areia/sobre-la-pasion/build/review/page-13.jpg
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Actualiza muestra maquetada 01-09"
            git push
          fi
