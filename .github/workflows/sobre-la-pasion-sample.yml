name: Sobre la pasión - muestra 01-09

on:
  push:
    branches: [main]
    paths:
      - 'sobre-la-pasion/**'
      - '.github/workflows/sobre-la-pasion-sample.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py

      - name: Obtener sello institucional usado por Diálogos Eleatas
        run: |
          mkdir -p sobre-la-pasion/assets
          curl --fail --location --silent --show-error             https://www.meriadock.org.mx/logo.svg             --output sobre-la-pasion/assets/logo.svg

      - name: Generar muestra PDF
        run: |
          python sobre-la-pasion/maquetacion/build_sample.py             --root sobre-la-pasion             --output sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf

      - name: Preflight básico
        run: |
          pdfinfo sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf
          pdftotext sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf - | head -120

      - name: Render de control
        run: |
          mkdir -p sobre-la-pasion/build/preview
          pdftoppm -png -r 110 -f 1 -l 14             sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf             sobre-la-pasion/build/preview/page >/dev/null 2>&1

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sobre-la-pasion-muestra-01-09
          path: |
            sobre-la-pasion/build/sobre-la-pasion-muestra-01-09.pdf
            sobre-la-pasion/build/preview/*.png
          if-no-files-found: error
