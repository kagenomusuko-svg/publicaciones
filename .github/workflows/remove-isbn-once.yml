name: One-time ISBN cleanup
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-isbn-once.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Remove placeholder ISBN lines
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter
          import numpy as np
          root = Path("reivindicacion-ontologica-del-ego/afrodita-areia")
          boxes = {
              "damasen/Contraportada.png": (439,1284,620,1300),
              "areopago/contraportada.png": (439,1282,620,1298),
              "caelus/Contraportada.png": (440,1284,619,1299),
              "nikomachos/Contraportada.png": (449,1321,636,1338),
              "agape/contraportada.png": (439,1321,621,1338),
              "sobre-la-pasion/Contra portada Vol I.png": (398,1367,627,1387),
          }
          for rel, (x0,y0,x1,y1) in boxes.items():
              path = root / rel
              image = Image.open(path).convert("RGB")
              pixels = np.asarray(image).astype(np.float32).copy()
              pad = 7
              top = np.median(pixels[y0-pad:y0, x0:x1+1], axis=0)
              bottom = np.median(pixels[y1+1:y1+1+pad, x0:x1+1], axis=0)
              height = y1-y0+1
              for offset, row in enumerate(range(y0,y1+1)):
                  fraction = (offset+1)/(height+1)
                  pixels[row,x0:x1+1] = top*(1-fraction) + bottom*fraction
              repaired = Image.fromarray(np.clip(pixels,0,255).astype("uint8"))
              mask = Image.new("L", image.size, 0)
              ImageDraw.Draw(mask).rectangle((x0,y0,x1,y1), fill=255)
              mask = mask.filter(ImageFilter.GaussianBlur(radius=1.2))
              Image.composite(repaired,image,mask).save(path,format="PNG",optimize=True)
          PY
          git rm .github/workflows/remove-isbn-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reivindicacion-ontologica-del-ego/afrodita-areia
          git commit -m "Remove placeholder ISBNs from back covers"
          git push
