name: Nikomachos - maquetación con DOI

on:
  push:
    branches: [main]
    paths:
      - 'reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/*.md'
      - 'reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/*.png'
      - 'reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/maquetacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/nikomachos-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Obtener sello institucional
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/assets/logo.svg

      - name: Generar PDF
        run: |
          python maquetacion/build_book.py             --root reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos             --output reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.pdf

      - name: Preflight
        run: |
          pdfinfo reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.pdf
          pdftotext reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.pdf reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.txt
          grep -q "NIKOMACHOS" reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.txt
          grep -q "10.5281/zenodo.22931825" reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.txt
          grep -q "La pregunta antes del hombre" reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.txt
          grep -q "El acto soy yo" reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.txt
          grep -q "Responsabilidad sin juicio ontológico" reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.txt
          grep -q "El límite de la predicación" reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.txt

      - name: Hoja de contacto
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          pdf = Path('reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.pdf')
          audit = pdf.with_suffix('.pages.json')
          root = Path('reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build')
          review = root / 'review'
          review.mkdir(parents=True, exist_ok=True)
          pages = __import__('json').loads(audit.read_text(encoding='utf-8'))['total_pages']
          for page, label in [(1, 'portada'), (2, 'portadilla'), (pages, 'contraportada')]:
              import subprocess
              subprocess.run(['pdftoppm','-jpeg','-r','110','-f',str(page),'-l',str(page),str(pdf),str(review/label)], check=True)
          cards = []
          for path in sorted(review.glob('*.jpg')):
              image = Image.open(path).convert('RGB')
              image.thumbnail((240, 360))
              card = Image.new('RGB', (260, 395), 'white')
              card.paste(image, ((260-image.width)//2, 8))
              ImageDraw.Draw(card).text((8, 372), path.stem, fill='black')
              cards.append(card)
          sheet = Image.new('RGB', (780, 395), '#eeeeee')
          for index, card in enumerate(cards):
              sheet.paste(card, (index*260, 0))
          sheet.save(root/'afrodita-areia-vol-vi-nikomachos-contacto.jpg', quality=88, optimize=True)
          PY

      - name: Publicar artefacto de Zenodo
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: afrodita-areia-vol-vi-nikomachos
          path: |
            reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.pdf
            reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos.pages.json
            reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build/afrodita-areia-vol-vi-nikomachos-contacto.jpg
          retention-days: 14

      - name: Guardar maquetación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reivindicacion-ontologica-del-ego/reivindicacion-ontologica-del-ego/afrodita-areia/nikomachos/build
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Genera maquetación de Nikomachos con DOI"
            git pull --rebase origin main
            git push
          fi
