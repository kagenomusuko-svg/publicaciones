name: El telar de las Moiras - libro completo

on:
  push:
    branches: [main]
    paths:
      - 'reivindicacion-ontologica-del-ego/telar-de-las-moiras/*.md'
      - 'reivindicacion-ontologica-del-ego/telar-de-las-moiras/*.png'
      - 'reivindicacion-ontologica-del-ego/telar-de-las-moiras/maquetacion.json'
      - 'reivindicacion-ontologica-del-ego/telar-de-las-moiras/publicacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/telar-de-las-moiras-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Obtener sello institucional
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/telar-de-las-moiras/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output reivindicacion-ontologica-del-ego/telar-de-las-moiras/assets/logo.svg

      - name: Generar libro completo
        run: |
          python maquetacion/build_book.py \
            --root reivindicacion-ontologica-del-ego/telar-de-las-moiras \
            --output reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pdf

      - name: Preflight textual
        run: |
          test -s reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pdf
          pdftotext reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pdf reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.txt
          grep -qi "TELAR DE LAS MOIRAS" reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.txt
          grep -qi "autodeterminación causal" reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.txt

      - name: Render de control
        run: |
          mkdir -p reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/review
          pdfinfo reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pdf
          pdftoppm -jpeg -r 100 -f 1 -l 1 reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pdf reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/review/portada
          pages=$(pdfinfo reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pdf | awk '/^Pages:/ {print $2}')
          pdftoppm -jpeg -r 100 -f "$pages" -l "$pages" reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pdf reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/review/contraportada

      - name: Publicar artefacto
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: el-telar-de-las-moiras
          path: |
            reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pdf
            reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pages.json
            reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/review/*.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Publicar PDF y portada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/libros/telar-de-las-moiras
          cp reivindicacion-ontologica-del-ego/telar-de-las-moiras/build/el-telar-de-las-moiras.pdf "public/libros/telar-de-las-moiras/El telar de las Moiras - Ontología de la autodeterminación causal.pdf"
          cp reivindicacion-ontologica-del-ego/telar-de-las-moiras/Portada.png public/libros/telar-de-las-moiras/portada.png
          git add reivindicacion-ontologica-del-ego/telar-de-las-moiras/build
          git add public/libros/telar-de-las-moiras
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Genera El telar de las Moiras completo"
            git pull --rebase origin main
            git push
          fi
