name: Ágape - libro completo

on:
  push:
    branches: [main]
    paths:
      - 'afrodita-areia/agape/*.md'
      - 'afrodita-areia/agape/*.png'
      - 'afrodita-areia/agape/maquetacion.json'
      - 'maquetacion/build_book.py'
      - 'maquetacion/estilo-libro-6x9.css'
      - '.github/workflows/agape-full.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ebgaramond poppler-utils libpango-1.0-0 libpangoft2-1.0-0

      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install weasyprint markdown-it-py pillow pypdf

      - name: Obtener sello institucional
        run: |
          mkdir -p afrodita-areia/agape/assets
          curl --fail --location --silent --show-error https://www.meriadock.org.mx/logo.svg --output afrodita-areia/agape/assets/logo.svg

      - name: Generar libro completo
        run: |
          python maquetacion/build_book.py \
            --root afrodita-areia/agape \
            --output afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.pdf

      - name: Preflight textual y estructural
        run: |
          pdfinfo afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.pdf
          pdftotext afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.pdf afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.txt
          grep -q "AFRODITA AREIA" afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.txt
          grep -q "ÁGAPE" afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.txt
          grep -q "Capítulo 15" afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.txt
          grep -q "Himeno" afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.txt
          grep -q "Glosario de términos" afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.txt

      - name: Render de páginas de control
        run: |
          rm -rf afrodita-areia/agape/build/review-full
          mkdir -p afrodita-areia/agape/build/review-full
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from pypdf import PdfReader

          pdf = Path('afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.pdf')
          reader = PdfReader(str(pdf))
          targets = [('portada', 1), ('portadilla', 2)]
          needles = [
              ('indice', 'ÍNDICE'),
              ('parte-i', 'Parte I'),
              ('capitulo-1', 'Capítulo 1'),
              ('parte-v', 'Parte V'),
              ('capitulo-15', 'Capítulo 15'),
              ('apendice', 'Apéndice'),
              ('glosario', 'Glosario de términos'),
          ]
          for label, needle in needles:
              for index, page in enumerate(reader.pages, 1):
                  if needle in (page.extract_text() or ''):
                      targets.append((label, index))
                      break
          targets.append(('contraportada', len(reader.pages)))
          for label, page_no in targets:
              out = Path('afrodita-areia/agape/build/review-full') / label
              subprocess.run([
                  'pdftoppm', '-jpeg', '-r', '110', '-f', str(page_no), '-l', str(page_no),
                  str(pdf), str(out)
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          Path('afrodita-areia/agape/build/review-full/manifest.txt').write_text(
              '\n'.join(f'{label}: {page}' for label, page in targets),
              encoding='utf-8',
          )
          PY

      - name: Hoja de contacto
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path('afrodita-areia/agape/build/review-full')
          cards = []
          for path in sorted(root.glob('*.jpg')):
              image = Image.open(path).convert('RGB')
              image.thumbnail((240, 360))
              card = Image.new('RGB', (260, 395), 'white')
              card.paste(image, ((260 - image.width) // 2, 8))
              ImageDraw.Draw(card).text((8, 372), path.stem.rsplit('-', 1)[0], fill='black')
              cards.append(card)
          cols = 4
          rows = (len(cards) + cols - 1) // cols
          sheet = Image.new('RGB', (cols * 260, rows * 395), '#eeeeee')
          for index, card in enumerate(cards):
              sheet.paste(card, ((index % cols) * 260, (index // cols) * 395))
          sheet.save('afrodita-areia/agape/build/afrodita-areia-vol-ii-contacto.jpg', quality=88, optimize=True)
          PY

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: afrodita-areia-vol-ii-agape
          path: |
            afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.pdf
            afrodita-areia/agape/build/afrodita-areia-vol-ii-contacto.jpg
            afrodita-areia/agape/build/review-full/manifest.txt
            afrodita-areia/agape/build/review-full/*.jpg
          if-no-files-found: error
          retention-days: 14

      - name: Guardar PDF y hoja de contacto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add afrodita-areia/agape/build/afrodita-areia-vol-ii-agape.pdf
          git add afrodita-areia/agape/build/afrodita-areia-vol-ii-contacto.jpg
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Genera Afrodita Areia Vol. II completo"
            git pull --rebase origin main
            git push
          fi
